[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"
  DB_PATH = "/tmp/skillsbridge.db"

[functions]
  directory = "netlify/functions"

[functions."api"]
  included_files = [
    "app.py",
    "config.py",
    "templates/**",
    "static/**",
    "database/**",
    "models/**",
    "routes/**",
    "ml/**"
  ]

# Forward ALL traffic to the Flask serverless function.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[headers."/static/*"]
  Cache-Control = "public, max-age=31536000, immutable"