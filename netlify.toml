[build]
  command = "pip install -r requirements.txt"
  functions = "functions"
  publish = "static"

[functions]
  included_files = ["templates/**", "models/**", "routes/**", "ml/**", "database/**", "config.py", "app.py"]

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
