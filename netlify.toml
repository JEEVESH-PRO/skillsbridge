[build]
  command = "pip install -r requirements.txt"
  functions = "functions"
  publish = "public"

[functions]
  directory = "functions"

[functions."api"]
  included_files = [
    "app.py",
    "config.py",
    "templates/**",
    "static/**",
    "database/**",
    "models/**",
    "routes/**",
    "ml/**",
    "functions/resume_parser.py",
  ]

# Forward ALL traffic (including /static) to the Flask serverless function.
# Flask serves /static/* from its bundled static folder, and every other path
# is handled by the app routes. The secret service account key is NOT published
# statically. It must be supplied via the FIREBASE_SERVICE_ACCOUNT_JSON env var.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[headers."/static/*"]
  Cache-Control = "public, max-age=31536000, immutable"
