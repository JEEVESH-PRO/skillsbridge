{% extends "base.html" %}

{% block title %}Offer New Course - SkillsBridge{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto 0 auto;" class="glass-panel">
    <div style="padding: 2rem;">
        <h2 style="font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem;">Offer Company Upskilling Course</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Provide official training resources to candidates missing key technical skills
        </p>

        <form method="POST" action="{{ url_for('employer.new_course') }}">
            <div class="form-group">
                <label class="form-label" for="skill_id">Target Missing Skill</label>
                <select name="skill_id" id="skill_id" class="form-select" required>
                    {% for s in skills %}
                        <option value="{{ s.id }}">{{ s.name }} ({{ s.category }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="title">Course Title</label>
                <input type="text" id="title" name="title" class="form-input" placeholder="e.g. Google Cloud Containerization Bootcamp" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="url">Resource URL</label>
                <input type="url" id="url" name="url" class="form-input" placeholder="https://..." required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="duration">Duration</label>
                    <input type="text" id="duration" name="duration" class="form-input" placeholder="e.g. 3 Weeks / 8 Hours">
                </div>

                <div class="form-group">
                    <label class="form-label" for="difficulty">Difficulty</label>
                    <select name="difficulty" id="difficulty" class="form-select">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate" selected>Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-accent" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                Publish Course for Candidates →
            </button>
        </form>
    </div>
</div>
{% endblock %}
